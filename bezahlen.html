<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starter Forge kaufen • ShopForge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2310b981'/><text x='50' y='62' font-size='42' fill='white' text-anchor='middle' font-family='Inter, Arial' font-weight='700'>SF</text></svg>">
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    .payment-option {
      transition: all 0.2s ease;
    }
    .payment-option:hover {
      border-color: #10b981;
      transform: translateY(-1px);
    }
    .payment-option.selected {
      border-color: #10b981;
      background-color: #f0fdf4;
    }
  </style>
</head>
<body class="bg-zinc-50 text-zinc-900 flex items-center justify-center min-h-screen p-4">

  <div class="max-w-md w-full">
    
    <!-- Header -->
    <div class="text-center mb-6">
      <h1 class="text-2xl font-semibold">Starter Forge kaufen</h1>
      <div class="mt-1">
        <span class="text-3xl font-bold">49,99 €</span>
        <span class="text-sm text-zinc-500 ml-1">einmalig</span>
      </div>
    </div>

    <div class="bg-white border border-zinc-200 rounded-3xl p-6 shadow-sm">
      
      <!-- EXPRESS CHECKOUT -->
      <div class="mb-6">
        <div class="flex items-center gap-2 mb-3">
          <i class="fa-solid fa-bolt text-emerald-600"></i>
          <span class="font-semibold text-sm">Express Checkout</span>
        </div>
        
        <div class="grid grid-cols-2 gap-3">
          <!-- Apple Pay -->
          <button onclick="selectExpressMethod('apple_pay')"
                  class="payment-option flex flex-col items-center justify-center border-2 border-zinc-200 rounded-2xl py-4 hover:border-emerald-500">
            <i class="fa-brands fa-apple-pay text-5xl mb-1"></i>
            <span class="text-sm font-medium">Apple Pay</span>
          </button>
          
          <!-- Google Pay -->
          <button onclick="selectExpressMethod('google_pay')"
                  class="payment-option flex flex-col items-center justify-center border-2 border-zinc-200 rounded-2xl py-4 hover:border-emerald-500">
            <i class="fa-brands fa-google-pay text-5xl mb-1"></i>
            <span class="text-sm font-medium">Google Pay</span>
          </button>
        </div>
      </div>

      <div class="border-t border-zinc-100 my-4"></div>

      <!-- ANDERE METHODEN -->
      <div>
        <div class="text-sm font-semibold mb-3 text-zinc-700">Andere Zahlungsmethoden</div>
        
        <div class="space-y-2">
          <!-- Kreditkarte -->
          <button onclick="selectPaymentMethod('card')"
                  class="payment-option w-full flex items-center justify-between border-2 border-zinc-200 rounded-2xl px-4 py-3.5 text-left hover:border-emerald-500">
            <div class="flex items-center gap-3">
              <i class="fa-solid fa-credit-card text-xl text-zinc-600 w-6"></i>
              <span class="font-medium">Kreditkarte / Debitkarte</span>
            </div>
            <div class="flex gap-1 text-2xl text-zinc-400">
              <i class="fa-brands fa-cc-visa"></i>
              <i class="fa-brands fa-cc-mastercard"></i>
            </div>
          </button>

          <!-- PayPal -->
          <button onclick="selectPaymentMethod('paypal')"
                  class="payment-option w-full flex items-center justify-between border-2 border-zinc-200 rounded-2xl px-4 py-3.5 text-left hover:border-emerald-500">
            <div class="flex items-center gap-3">
              <i class="fa-brands fa-paypal text-xl text-zinc-600 w-6"></i>
              <span class="font-medium">PayPal</span>
            </div>
          </button>

          <!-- SEPA -->
          <button onclick="selectPaymentMethod('sepa')"
                  class="payment-option w-full flex items-center justify-between border-2 border-zinc-200 rounded-2xl px-4 py-3.5 text-left hover:border-emerald-500">
            <div class="flex items-center gap-3">
              <i class="fa-solid fa-university text-xl text-zinc-600 w-6"></i>
              <span class="font-medium">SEPA-Lastschrift</span>
            </div>
          </button>
        </div>
      </div>

      <!-- Stripe Container -->
      <div id="stripe-section" class="hidden mt-6">
        <div class="mb-4">
          <div id="payment-element" class="border border-zinc-300 rounded-2xl p-4"></div>
        </div>

        <button onclick="confirmStripePayment()" id="pay-button"
                class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-4 rounded-2xl text-lg flex items-center justify-center gap-2">
          Jetzt sicher bezahlen
        </button>
      </div>

      <!-- Trust -->
      <div class="mt-6 text-center text-xs text-zinc-500">
        Deine Daten werden ausschließlich zur Abwicklung deines Kaufs verwendet.<br>
        Sie werden weder gespeichert noch an Dritte weitergegeben.
      </div>

    </div>
  </div>

  <script src="https://js.stripe.com/v3/"></script>
  <script>
    const stripe = Stripe('pk_test_51TtChTCghXYrwH8yp5QDJZrr4r8KUxBMAJq5EPrhCi9RntjrVEPBB4XRDRCCXjA2GB4ebiYcaN05FobYEaVlDRWP00uKpcWXss');
    const BACKEND_URL = 'https://shopforge-backend-fixed.vercel.app/';

    let elements = null;

    async function initializeStripe() {
      if (elements) return;

      const response = await fetch(`${BACKEND_URL}/create-payment-intent`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ amount: 4999 })
      });

      const { clientSecret } = await response.json();

      elements = stripe.elements({ clientSecret, locale: 'de' });

      const paymentElement = elements.create('payment', {
        layout: { type: 'accordion', defaultCollapsed: false }
      });
      paymentElement.mount('#payment-element');
    }

    async function selectExpressMethod(method) {
      // For now we treat express methods the same as card (Stripe handles it)
      await selectPaymentMethod('card');
    }

    async function selectPaymentMethod(method) {
      // Highlight all buttons
      document.querySelectorAll('.payment-option').forEach(el => {
        el.classList.remove('selected', 'border-emerald-500');
      });
      event.currentTarget.classList.add('selected', 'border-emerald-500');

      const section = document.getElementById('stripe-section');
      section.classList.remove('hidden');

      await initializeStripe();
    }

    async function confirmStripePayment() {
      const button = document.getElementById('pay-button');
      button.disabled = true;
      button.textContent = 'Wird verarbeitet...';

      const { error } = await stripe.confirmPayment({
        elements,
        confirmParams: {
          return_url: window.location.origin + '/erfolg.html',
        },
      });

      if (error) {
        alert(error.message);
        button.disabled = false;
        button.textContent = 'Jetzt sicher bezahlen';
      }
    }
  </script>
</body>
</html>
