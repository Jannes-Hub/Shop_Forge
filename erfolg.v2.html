<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vielen Dank! • ShopForge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body class="bg-zinc-50 flex items-center justify-center min-h-screen p-4">

  <div class="max-w-md w-full bg-white rounded-3xl shadow border border-zinc-200 p-8">
    
    <div class="text-center">
      <div class="mx-auto w-16 h-16 bg-emerald-100 rounded-full flex items-center justify-center mb-6">
        <i class="fa-solid fa-check text-emerald-600 text-4xl"></i>
      </div>
      <h1 class="text-2xl font-semibold tracking-tight">Vielen Dank für deinen Kauf!</h1>
      <p class="mt-2 text-zinc-600">Bitte gib deine E-Mail-Adresse ein, damit wir dir den Download-Link zusenden können.</p>
    </div>

    <!-- Email Form -->
    <form id="email-form" class="mt-8 space-y-4">
      <div>
        <label class="block text-sm font-medium text-zinc-700 mb-1.5">Deine E-Mail-Adresse</label>
        <input type="email" id="customer-email" required 
               class="w-full border border-zinc-300 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500"
               placeholder="max@beispiel.de">
      </div>

      <button type="submit" 
              class="w-full py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-2xl text-lg transition flex items-center justify-center gap-x-2">
        <span>Download-Link per E-Mail erhalten</span>
      </button>
    </form>

    <div id="success-message" class="hidden mt-6 text-center text-emerald-600 font-medium">
      ✓ Vielen Dank! Die E-Mail wurde versendet.<br>
      Bitte prüfe auch deinen Spam-Ordner.
    </div>

  </div>

  <script>
    // EmailJS initialisieren
    emailjs.init({
  publicKey: "h1jIS1-c_G5Utsm4t",
  privateKey: "Nr-9BLdIYog3iyP17H9oz"
}); // Dein Public Key

    const form = document.getElementById('email-form');
    const successMessage = document.getElementById('success-message');

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      const email = document.getElementById('customer-email').value;

      const templateParams = {
        email: email,
        download_link: "https://www.dropbox.com/scl/fi/4fjn3qbkbnafk2np1df9l/ShopForge-Starter-Paket.zip?rlkey=vg8dtccmpu4fjy5oce4wh0560&st=3ht9oz2i&dl=1",
      };

      emailjs.send("service_h38pyay", "Forge_Email", templateParams)
        .then(function(response) {
          form.classList.add('hidden');
          successMessage.classList.remove('hidden');
        }, function(error) {
          alert("Es gab ein Problem beim Versenden der E-Mail. Bitte schreibe mir direkt an jannes.hupfeld@web.de");
          console.error('EmailJS Error:', error);
        });
    });
  </script>
</body>
</html>
